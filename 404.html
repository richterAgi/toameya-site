<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>העמוד לא נמצא | טועמיה</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" sizes="32x32" href="/toameya-site/img-favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root { --brand: #f2911f; --dark: #bf7318; --cream: #f6ece4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: "Heebo", "Segoe UI", system-ui, sans-serif;
      text-align: center;
      color: #2a1806;
      background:
        linear-gradient(135deg, var(--brand) 0 22%, transparent 22% 78%, var(--brand) 78%),
        var(--cream);
    }
    img { width: min(180px, 45vw); height: auto; filter: drop-shadow(0 10px 20px rgba(0,0,0,.25)); }
    h1 { margin: 1rem 0 .3rem; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    p { margin: 0 0 1.6rem; font-size: 1.1rem; }
    .en { opacity: .75; font-size: .95rem; margin-top: -1rem; }
    a {
      display: inline-block; padding: .9rem 1.8rem; border-radius: 999px;
      background: #2a1806; color: #fff; font-weight: 700; text-decoration: none;
      transition: transform .2s ease;
    }
    a:hover, a:focus-visible { transform: scale(1.06); }
    a:focus-visible { outline: 3px solid #2a1806; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/toameya-site/img-logo.png" alt="טועמיה" width="451" height="424" />
    <h1>אופס… המנה הזאת לא בתפריט</h1>
    <p>העמוד שחיפשתם לא נמצא.</p>
    <p class="en" lang="en" dir="ltr">Sorry, this page doesn't exist.</p>
    <a href="/toameya-site/">חזרה לדף הבית</a>
  </main>
</body>
</html>
